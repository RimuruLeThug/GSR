plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = 'dev.gsr'

repositories {
    maven { url = 'https://api.modrinth.com/maven' }   // Iris (API seulement, optionnelle)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Iris : compilation seulement, chargé dynamiquement via IrisCompat
    modCompileOnly "maven.modrinth:iris:${project.iris_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Tests du cœur (sans Minecraft) : ./gradlew coreSelfTest
tasks.register('coreSelfTest', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gsr.core.CoreSelfTest'
}

// Développement : ./gradlew runClient -PgsrAutoshot=<préfixe> -> captures automatiques normal/ssr/gsr
// dans run/screenshots (voir GsrClient#autoShot). -PgsrCmds="cmd1;cmd2" : commandes avant les captures.
tasks.named('runClient', JavaExec) {
    if (project.hasProperty('gsrAutoshot')) systemProperty 'gsr.autoshot', project.property('gsrAutoshot')
    if (project.hasProperty('gsrCmds')) systemProperty 'gsr.autoshotCmds', project.property('gsrCmds')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

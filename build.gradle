plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
}

version = project.mod_version
group = 'dev.gsr'

repositories {
    maven { url = 'https://api.modrinth.com/maven' }   // Iris (API only, optional)
    maven { url = 'https://maven.terraformersmc.com/releases' }   // Mod Menu (API only, optional)
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Iris: compile-time only, loaded dynamically via IrisCompat
    modCompileOnly "maven.modrinth:iris:${project.iris_version}"
    // Mod Menu: "Configure" button -> GsrOptionsScreen (entrypoint only loaded when Mod Menu is present)
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Compatibility: ./gradlew runClient -PwithSodium or -PwithIris (never bundled into the jar)
    if (project.hasProperty("withSodium") || project.hasProperty("withIris")) modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
    if (project.hasProperty("withIris")) {
        modLocalRuntime "maven.modrinth:iris:${project.iris_runtime_version}"
        // Libraries nested inside Iris's jar, not loaded in the dev environment
        localRuntime "org.anarres:jcpp:1.4.14"
        localRuntime "io.github.douira:glsl-transformer:2.0.1"
        localRuntime "org.antlr:antlr4-runtime:4.13.1"
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Core tests (without Minecraft): ./gradlew coreSelfTest
tasks.register('coreSelfTest', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gsr.core.CoreSelfTest'
}

// Development: ./gradlew runClient -PgsrAutoshot=<prefix> -> automatic normal/ssr/gsr captures
// in run/screenshots (see GsrClient#autoShot). -PgsrCmds="cmd1;cmd2": commands run before the captures.
tasks.named('runClient', JavaExec) {
    if (project.hasProperty('gsrAutoshot')) systemProperty 'gsr.autoshot', project.property('gsrAutoshot')
    if (project.hasProperty('gsrCmds')) systemProperty 'gsr.autoshotCmds', project.property('gsrCmds')
    if (project.hasProperty('gsrMove')) systemProperty 'gsr.autoshotMove', project.property('gsrMove')
    if (project.hasProperty('gsrBursts')) systemProperty 'gsr.autoshotBursts', project.property('gsrBursts')
    if (project.hasProperty('gsrVideo')) systemProperty 'gsr.autoshotVideo', project.property('gsrVideo')
    if (project.hasProperty('gsrBench')) systemProperty 'gsr.benchRepeat', project.property('gsrBench')
    if (project.hasProperty('gsrBenchOverlap')) systemProperty 'gsr.benchOverlap', 'true'
    if (project.hasProperty('gsrUiTest')) systemProperty 'gsr.uiTest', project.property('gsrUiTest')
    // Dev fault injection (GsrGpuResources): -PgsrFakeMaxSsboBlock=<bytes> overrides the driver's max SSBO
    // block size, -PgsrFakeSsboOom simulates GL_OUT_OF_MEMORY on the splat buffer. Both must disable GSR cleanly.
    if (project.hasProperty('gsrFakeMaxSsboBlock')) systemProperty 'gsr.fakeMaxSsboBlock', project.property('gsrFakeMaxSsboBlock')
    if (project.hasProperty('gsrFakeSsboOom')) systemProperty 'gsr.fakeSsboOom', 'true'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

// Service-mode test pack (examples/gsr-testpack + gsr_common.glsl) -> run/shaderpacks/GSR-TestPack.
// To select in Iris: ./gradlew runClient -PwithIris (shaderPack=GSR-TestPack in run/config/iris.properties).
tasks.register('gsrTestPack', Sync) {
    from('examples/gsr-testpack')
    from('src/main/resources/assets/gsr/shaders/gsr_common.glsl') { into 'shaders/lib' }
    into 'run/shaderpacks/GSR-TestPack'
}
if (project.hasProperty('withIris')) tasks.named('runClient') { dependsOn 'gsrTestPack' }
